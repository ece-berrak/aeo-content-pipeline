<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{meta_title}}</title>
  <meta name="description" content="{{meta_description}}">

  <link rel="canonical" href="{{canonical_url}}">

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{meta_title}}">
  <meta property="og:description" content="{{meta_description}}">
  <meta property="og:url" content="{{canonical_url}}">
  <meta property="article:published_time" content="{{published_at}}">
  <meta property="article:author" content="{{author}}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{meta_title}}">
  <meta name="twitter:description" content="{{meta_description}}">

  <!-- Schema.org JSON-LD, generated by the pipeline -->
  <script type="application/ld+json">
{{schema_org_json}}
  </script>

  <!--
    This is the reference blog template shipped with aeo-content-pipeline.
    It is intentionally minimal — copy it into your own site repo and adapt
    the styles to match your brand. The pipeline only needs the {{...}}
    placeholders below to be present; everything else is yours to change.
  -->

  <style>
    :root {
      --bg: #FAF8F1;
      --ink: #0E0D14;
      --ink-2: #2A2735;
      --ink-3: #5C5868;
      --accent: #4F32D8;
      --rule: #1f1c2a14;
      --maxw: 720px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 32px 24px 80px; }
    nav.site-nav { padding: 24px; border-bottom: 1px solid var(--rule); }
    nav.site-nav a { color: var(--ink); text-decoration: none; font-weight: 500; }
    article header { margin: 32px 0 40px; }
    article header h1 { font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.15; margin: 0 0 16px; letter-spacing: -.02em; }
    article header .meta { color: var(--ink-3); font-size: 14px; }
    article h2 { font-size: clamp(1.5rem, 3vw, 2rem); margin: 48px 0 16px; line-height: 1.2; }
    article h3 { font-size: 1.25rem; margin: 32px 0 12px; line-height: 1.3; }
    article p { margin: 0 0 1.25em; color: var(--ink-2); }
    article ul, article ol { margin: 0 0 1.5em; padding-left: 1.5em; }
    article li { margin-bottom: .5em; color: var(--ink-2); }
    article blockquote {
      margin: 1.5em 0; padding: 16px 20px;
      border-left: 3px solid var(--accent);
      background: rgba(79, 50, 216, .04);
      color: var(--ink);
      font-style: italic;
    }
    article code {
      background: #0E0D1410; padding: 2px 6px; border-radius: 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    article pre {
      background: var(--ink); color: var(--bg);
      padding: 16px 20px; border-radius: 8px;
      overflow-x: auto;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px; line-height: 1.5;
    }
    article pre code { background: transparent; padding: 0; color: inherit; }
    .faq { margin-top: 64px; padding-top: 32px; border-top: 1px solid var(--rule); }
    .faq h2 { margin-top: 0; }
    .faq details { margin-bottom: 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
    .faq summary { font-weight: 500; cursor: pointer; font-size: 1.05rem; }
    .faq details[open] summary { color: var(--accent); }
    .cta {
      margin: 64px 0 32px;
      padding: 24px;
      background: var(--ink); color: var(--bg);
      border-radius: 8px;
    }
    .cta p { color: var(--bg); margin: 0 0 12px; }
    .cta a {
      display: inline-block;
      padding: 10px 20px;
      background: var(--accent); color: var(--bg);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
    }
    footer.site-footer {
      border-top: 1px solid var(--rule);
      padding: 32px 24px;
      color: var(--ink-3); font-size: 13px;
    }
    footer.site-footer .wrap { padding-top: 0; padding-bottom: 0; }
  </style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap" style="padding: 0; display: flex; justify-content: space-between;">
    <a href="/">{{brand_name}}</a>
    <a href="/blog/">All posts</a>
  </div>
</nav>

<div class="wrap">
  <article>
    <header>
      <h1>{{title}}</h1>
      <div class="meta">
        <time datetime="{{published_at}}">{{published_at_human}}</time>
        · {{author}}
        · {{word_count}} words
      </div>
    </header>

    <!-- Main body rendered from markdown by the pipeline -->
    {{body_html}}

    <!-- FAQ section, rendered server-side from the faq[] array -->
    {{faq_html}}

    <!-- CTA injected by the pipeline -->
    {{cta_html}}
  </article>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>{{brand_one_liner}}</p>
    <p>© {{current_year}} {{brand_name}}</p>
  </div>
</footer>

</body>
</html>
